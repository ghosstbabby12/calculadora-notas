name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: |
            htmlcov/
            coverage.xml
  sonar:
    needs: pruebas
    runs-on: ubuntu-latest
    # Los PR de forks no reciben SONAR_TOKEN: se omite el análisis en vez de
    # dejar el check en rojo por un fallo de configuración ajeno al cambio.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cobertura
      - name: SonarQube Cloud Quality Gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  api:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --abort-on-container-exit --exit-code-from test-runner
      - if: always()
        run: docker compose down -v
  e2e:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # --wait espera a que api y frontend pasen su healthcheck (frontend verifica /api/salud).
      - name: Levantar API y frontend
        run: docker compose up -d --build --wait frontend
      - name: Instalar Playwright
        run: |
          pip install -r requirements.txt -r tests/e2e/requirements.txt
          playwright install --with-deps chromium
      - name: Pruebas E2E
        env:
          FRONTEND_URL: http://localhost:8080
        run: pytest -m e2e --no-cov --screenshot only-on-failure --output test-results
      - name: Subir capturas de las pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: test-results/
          if-no-files-found: ignore
      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs api frontend
      - if: always()
        run: docker compose down -v
