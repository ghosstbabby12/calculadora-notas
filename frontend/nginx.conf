# Configuración del sitio. Reemplaza /etc/nginx/conf.d/default.conf de la imagen.
server {
    listen 80;
    server_name _;

    # Archivos estáticos del frontend (copiados por el Dockerfile).
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad para todas las respuestas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Solo se permite cargar scripts, estilos y peticiones del mismo origen.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 1) Frontend: si el archivo existe se entrega; si no, 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # 2) Proxy inverso: /api/xxx  ->  http://api:5000/xxx
    #    "api" es el nombre del servicio en Docker Compose (DNS interno de la red).
    #    La barra final en proxy_pass QUITA el prefijo /api antes de reenviar:
    #      /api/salud                  -> /salud
    #      /api/estudiantes/1/promedio -> /estudiantes/1/promedio
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_http_version 1.1;

        # Información del cliente original para el backend.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si la API no responde, Nginx devuelve 502/504 y el frontend
        # lo muestra como "servidor no disponible".
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 3) Laboratorio de carga: /carga/xxx -> http://carga:5001/xxx
    #    La barra final en proxy_pass QUITA el prefijo /carga, igual que en /api:
    #      /carga/ejecutar -> /ejecutar
    location /carga/ {
        proxy_pass http://carga:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
