services:
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "list-buckets"]
      interval: 3s
      timeout: 5s
      retries: 30
  api:
    build: .
    image: calculadora-notas:local
    command: ["sh", "-ec", "python -m infra.setup_aws && exec gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 8 app.main:app"]
    environment: &aws
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports:
      # PUERTO_API permite evitar el 5000, que en macOS ocupa AirPlay.
      - "127.0.0.1:${PUERTO_API:-5000}:5000"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/salud', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 30
  frontend:
    build: ./frontend
    image: calculadora-notas-frontend:local
    ports:
      # PUERTO_FRONTEND permite cambiar el 8080 si ya está ocupado.
      - "127.0.0.1:${PUERTO_FRONTEND:-8080}:80"
    depends_on:
      # Nginx resuelve el nombre "api" al arrancar: la API debe estar lista.
      api:
        condition: service_healthy
    healthcheck:
      # Verifica la página Y el proxy inverso en una sola consulta.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/salud"]
      interval: 3s
      timeout: 5s
      retries: 30
  test-runner:
    image: calculadora-notas:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *aws
      API_URL: http://api:5000
    command: ["pytest", "tests/api", "-p", "no:cacheprovider", "--no-cov"]
