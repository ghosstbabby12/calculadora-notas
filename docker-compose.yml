services:
  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: s3
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "list-buckets"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - notas-net

  api:
    build: .
    image: calculadora-notas:local
    # Prepara el bucket de Persona A antes de arrancar Flask.
    command: ["sh", "-ec", "python -m infra.setup_aws && exec python -m app.main"]
    environment: &aws
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/salud', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - notas-net

  # Ejecuta las pruebas de API contra el servicio `api`.
  # Uso: docker compose up --build --abort-on-container-exit --exit-code-from test-runner
  # --no-cov: la cobertura se mide en unit (test_client), aquí solo se valida el contrato.
  test-runner:
    image: calculadora-notas:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *aws
      API_URL: http://api:5000
      API_BASE_URL: http://api:5000
    command: ["pytest", "tests/api", "-p", "no:cacheprovider", "--no-cov", "-v"]
    networks:
      - notas-net

networks:
  notas-net:
    driver: bridge
